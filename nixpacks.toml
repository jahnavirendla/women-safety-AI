[phases.setup]
# Adding 'python311Packages.pip' ensures pip is actually installed
nixPkgs = ["python3", "python311Packages.pip", "portaudio", "gcc", "pkg-config", "libsndfile"]

[phases.install]
# We upgrade pip first just to be safe
cmds = ["python3 -m pip instali-r requirements.txt"]

[phases.start]
cmd = "python3 app.py"

[env]
PORT = "5000"
PYTHONPATH = "."